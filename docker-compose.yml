version: "3.8"

services:
  db:
    image: ankane/pgvector:latest          # pg + pgvector preinstalled
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snippet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snippet}
      POSTGRES_DB: ${POSTGRES_DB:-snippet}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
      - ./migration_01.sql:/docker-entrypoint-initdb.d/01_migration.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snippet}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - server/.env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - EMBEDDING_PROVIDER=ollama
      - LLM_PROVIDER=ollama
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
      - OLLAMA_GENERATION_MODEL=llama3.2
      - REDIS_URL=redis://redis:6379
      - OLLAMA_TIMEOUT_MS=90000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/usr/src/app     # helpful for dev (live code)
      - uploads:/usr/src/app/uploads
    ports:
      - "3001:3001"
    command: ["sh", "-c", "npm run db:init && node src/index.js"]
    restart: unless-stopped

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - server/.env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - EMBEDDING_PROVIDER=ollama
      - LLM_PROVIDER=ollama
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
      - OLLAMA_GENERATION_MODEL=llama3.2
      - REDIS_URL=redis://redis:6379
      - OLLAMA_TIMEOUT_MS=90000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/usr/src/app
      - uploads:/usr/src/app/uploads
    command: ["sh", "-c", "npm run worker || node src/services/worker.js"]
    restart: on-failure

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      - VITE_API_URL=http://localhost:3001/api
    ports:
      - "3000:3000"
    command: ["sh", "-c", "npm run start"]
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started

volumes:
  db_data:
  redis_data:
  uploads:
