# Render Blueprint — Free Tier Architecture

databases:
  - name: snippet-db
    plan: free           # Free Postgres (expires in 90 days, enough for testing)
    databaseName: snippet
    user: snippet
    postgresMajorVersion: "16"

services:
  # ── Express API Server (Free Tier) ──────────────────────────
  - type: web
    name: snippet-api
    runtime: node
    plan: free           # Free Web Service (spins down after inactivity)
    region: oregon
    rootDir: server
    buildCommand: npm ci --production
    startCommand: node src/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: snippet-db
          property: connectionString
      - key: GOOGLE_AI_API_KEY
        sync: false          # set manually in Render dashboard
      - key: LLM_PROVIDER
        value: google
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"
      - key: CLIENT_URL
        sync: false          # set to Vercel URL
      - key: UPLOAD_DIR
        value: ./uploads     # Ephemeral storage (fine since PDFs are only needed during processing)
      - key: MAX_FILE_SIZE
        value: "20971520"
      - key: SIMILARITY_THRESHOLD
        value: "0.55"
      - key: TOP_K_CHUNKS
        value: "5"
      - key: CHUNK_SIZE_TOKENS
        value: "512"
      - key: CHUNK_OVERLAP_TOKENS
        value: "50"
      - key: GOOGLE_AI_MODEL
        value: gemini-3.5-flash
      - key: GOOGLE_AI_MAX_OUTPUT_TOKENS
        value: "800"

