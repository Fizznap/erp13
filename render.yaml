# Render Blueprint — Free Tier Architecture

databases:
  - name: snippet-db
    plan: free           # Free Postgres (expires in 90 days, enough for testing)
    databaseName: snippet
    user: snippet
    postgresMajorVersion: "16"

services:
  - type: redis
    name: snippet-redis
    plan: free
    ipAllowList: []
  # ── Express API Server ──────────────────────────
  - type: web
    name: snippet-api
    runtime: node
    plan: free           # Reverted to free tier since no credit card is provided
    region: oregon
    rootDir: server
    buildCommand: npm ci --production
    # Keep destructive demo cleanup and account provisioning out of service restarts.
    startCommand: npm run db:init && node src/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: snippet-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: snippet-redis
          property: connectionString
      - key: GOOGLE_AI_API_KEY
        sync: false          # set manually in Render dashboard
      - key: LLM_PROVIDER
        value: google
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"
      - key: GOOGLE_CLIENT_ID
        sync: false          # same OAuth web client ID as VITE_GOOGLE_CLIENT_ID in Vercel
      - key: SMTP_HOST
        sync: false          # SMTP provider for password-account email verification
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CLIENT_URL
        value: "https://client-phi-lake.vercel.app"
      - key: ADMIN_EMAIL
        value: "smit2shinde2@gmail.com"
      - key: ADMIN_NAME
        value: "Smit Shinde"
      - key: ADMIN_PASSWORD
        sync: false # optional; a one-time password is generated if unset
      - key: CURRENT_SEMESTER_NUMBER
        sync: false
      - key: ACADEMIC_SUBJECTS_JSON
        sync: false
      - key: UPLOAD_DIR
        value: ./uploads     # Ephemeral storage since disks aren't supported on free tier
      - key: MAX_FILE_SIZE
        value: "20971520"
      - key: SIMILARITY_THRESHOLD
        value: "0.35"
      - key: TOP_K_CHUNKS
        value: "5"
      - key: CHUNK_SIZE_TOKENS
        value: "512"
      - key: CHUNK_OVERLAP_TOKENS
        value: "50"
      - key: GOOGLE_AI_MODEL
        value: gemini-3.1-flash-lite
      - key: GOOGLE_AI_EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: GOOGLE_AI_MAX_OUTPUT_TOKENS
        value: "800"
