# Render Blueprint — Infrastructure-as-Code for Snippet backend
# Deploy: connect the GitHub repo → Render auto-discovers this file.

databases:
  - name: snippet-db
    plan: starter           # Starter plan (1 GB, supports extensions)
    databaseName: snippet
    user: snippet
    postgresMajorVersion: "16"
    ipAllowList: []         # Allow from Render services only

services:
  # ── Express API Server ──────────────────────────────────────
  - type: web
    name: snippet-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: server
    buildCommand: npm ci --production
    startCommand: node src/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: snippet-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: snippet-redis
          type: redis
          property: connectionString
      - key: GOOGLE_AI_API_KEY
        sync: false          # set manually in Render dashboard
      - key: LLM_PROVIDER
        value: google
      - key: JWT_SECRET
        generateValue: true  # auto-generate secure random
      - key: JWT_EXPIRES_IN
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"
      - key: CLIENT_URL
        sync: false          # set to Vercel URL after deploying frontend
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: MAX_FILE_SIZE
        value: "20971520"
      - key: SIMILARITY_THRESHOLD
        value: "0.55"
      - key: TOP_K_CHUNKS
        value: "5"
      - key: CHUNK_SIZE_TOKENS
        value: "512"
      - key: CHUNK_OVERLAP_TOKENS
        value: "50"
      - key: GOOGLE_AI_MODEL
        value: gemini-3.5-flash
      - key: GOOGLE_AI_MAX_OUTPUT_TOKENS
        value: "800"
    disk:
      name: uploads
      mountPath: /data/uploads
      sizeGB: 1

  # ── Bull Worker (background job processor) ──────────────────
  - type: worker
    name: snippet-worker
    runtime: node
    plan: starter
    region: oregon
    rootDir: server
    buildCommand: npm ci --production
    startCommand: node src/services/worker.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: snippet-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: snippet-redis
          type: redis
          property: connectionString
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: google
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: CHUNK_SIZE_TOKENS
        value: "512"
      - key: CHUNK_OVERLAP_TOKENS
        value: "50"
      - key: GOOGLE_AI_MODEL
        value: gemini-3.5-flash
      - key: GOOGLE_AI_MAX_OUTPUT_TOKENS
        value: "800"
    disk:
      name: uploads
      mountPath: /data/uploads
      sizeGB: 1

  # ── Redis ────────────────────────────────────────────────────
  - type: redis
    name: snippet-redis
    plan: starter
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
